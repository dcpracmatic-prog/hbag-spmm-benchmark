[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hbag-spmm-adaptive"
version = "0.3.0"
description = "Sparse x Dense matrix multiply with adaptive OpenMP scheduling"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "HBAG contributors"}]
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://example.invalid/hbag-spmm-adaptive"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
hbag = ["libhbag.so"]
